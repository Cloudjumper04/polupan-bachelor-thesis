<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartEnergy Lab — System Layout Mock v29</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jura:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --yellow: #ffdd55;
      --paper: #f3f3f1;
      --surface: #ffffff;
      --surface-2: #f8f8f6;
      --black: #050505;
      --muted: #606060;
      --line: #d9d9d4;
      --line-dark: #b8b8af;
      --shadow: 0 16px 40px rgba(0, 0, 0, 0.10);
      --radius: 16px;
      --font: "Jura", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --grid-navy: #09255c;
      --grid-navy-2: #12336f;
      --green-active: #34c94a;
      --green-dim: #92c98f;
      --red-active: #e45460;
      --red-dim: #d58a91;
      --blue-soft: rgba(9,37,92,0.08);
      --blue-line: rgba(9,37,92,0.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      font-weight: 600;
      color: var(--black);
      background: var(--paper);
    }

    button, input { font: inherit; }

    .site-header,
    .site-footer {
      background: var(--yellow);
      color: var(--black);
      overflow: hidden;
    }

    .header-inner,
    .footer-inner,
    .page {
      max-width: 1500px;
      margin: 0 auto;
      padding-left: 28px;
      padding-right: 28px;
    }

    .header-inner {
      height: 58px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.5px;
      line-height: 1;
      text-shadow: 0.25px 0 currentColor;
    }

    .brand-subtitle {
      margin-top: 4px;
      color: rgba(0,0,0,0.72);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 760px;
    }

    .weather-widget {
      display: flex;
      align-items: center;
      gap: 13px;
      height: 42px;
      padding: 5px 15px 5px 7px;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 21px;
      background: rgba(5,5,5,0.78);
      color: #fff;
      box-shadow: 0 8px 18px rgba(0,0,0,0.14);
    }

    .weather-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: inset -5px -5px 0 rgba(255,255,255,0.24);
      flex: 0 0 auto;
    }

    .weather-main {
      display: grid;
      gap: 1px;
      min-width: 126px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.05;
      white-space: nowrap;
    }

    .sun-times {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-left: 12px;
      border-left: 1px solid rgba(255,255,255,0.26);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .page {
      min-height: calc(100vh - 122px);
      padding-top: 18px;
      padding-bottom: 24px;
    }

    .dashboard-layout {
      width: 100%;
      height: calc(100vh - 170px);
      min-height: 690px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 16px;
      align-items: stretch;
    }

    .dashboard-left,
    .dashboard-right {
      min-width: 0;
      min-height: 0;
    }

    .dashboard-left {
      height: 100%;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 16px;
      align-content: stretch;
    }

    .dashboard-right {
      height: 100%;
      display: grid;
      grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
      gap: 16px;
    }

    .battery-load-row {
      height: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 16px;
      min-height: 0;
    }

    .grid-card,
    .solar-card,
    .system-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .grid-card {
      min-height: 178px;
      display: grid;
      grid-template-rows: auto auto;
    }

    .grid-main {
      padding: 12px 16px 6px;
      display: grid;
      gap: 7px;
    }

    .grid-top {
      min-height: 84px;
      display: grid;
      place-items: center;
      overflow: visible;
      margin: -12px -16px 0;
      padding: 12px 16px 0;
      background: linear-gradient(180deg, rgba(200, 216, 236, 0.74), var(--surface-2) 150%);
      border-bottom: 1px solid var(--line);
    }

    .grid-status-cluster {
      --status-label-row-height: clamp(26px, 2vw, 34px);
      --switch-stack-gap: 8px;
      --switch-pill-height: 24px;
      --metric-label-font-size: 11px;
      --metric-label-xheight-offset: 7px;
      --integrity-text-gap: 2px;
      --integrity-number-row-height: 32px;
      --integrity-circle-size: calc((var(--metric-label-font-size) + var(--integrity-text-gap) + var(--integrity-number-row-height)) * 0.92);
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) max-content minmax(0, 1fr) max-content minmax(0, 1fr) max-content minmax(0, 1fr);
      column-gap: 0;
      align-items: start;
    }

    .grid-top-divider {
      width: 1px;
      min-height: 62px;
      background: rgba(0,0,0,0.12);
      align-self: start;
      justify-self: center;
    }

    .switch-group { grid-column: 2; }
    .separator-after-switch { grid-column: 3; }
    .integrity-status-group { grid-column: 4; }
    .separator-after-integrity { grid-column: 5; }
    .voltage-group { grid-column: 6; }

    .network-tile {
      display: grid;
      grid-template-columns: auto auto;
      column-gap: 10px;
      align-items: center;
      justify-content: start;
    }

    .network-copy {
      display: grid;
      grid-template-rows: var(--status-label-row-height) auto;
      align-content: start;
      row-gap: var(--switch-stack-gap);
      justify-items: start;
    }

    .grid-title {
      align-self: start;
      margin: 0;
      font-size: clamp(26px, 2.0vw, 34px);
      font-weight: 900;
      letter-spacing: -0.8px;
      line-height: 0.95;
      text-shadow: 0.3px 0 currentColor;
    }

    .power-leds {
      height: calc((var(--status-label-row-height) + var(--switch-stack-gap) + var(--switch-pill-height)) * 0.75);
      display: grid;
      grid-template-columns: 7px 7px;
      gap: 4px;
      align-self: center;
    }

    .power-state-bar {
      width: 7px;
      height: 100%;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.16);
    }

    .power-leds.on .power-state-bar.green { background: var(--green-active); }
    .power-leds.on .power-state-bar.red { background: var(--red-dim); }

    .network-state-text {
      display: grid;
      place-items: center;
      min-width: 58px;
      height: var(--switch-pill-height);
      padding: 3px 10px;
      border: 1px solid rgba(9,37,92,0.16);
      border-radius: 999px;
      background: #fff;
      color: var(--grid-navy);
      font-size: 16px;
      font-weight: 900;
      line-height: 1;
      white-space: nowrap;
    }

    .metric-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .voltage-group {
      display: grid;
      grid-template-rows: auto auto;
      row-gap: 2px;
      align-content: start;
      justify-items: start;
      padding-top: 7px;
    }

    .grid-voltage {
      margin-top: 0;
      font-size: clamp(34px, 2.75vw, 48px);
      font-weight: 850;
      letter-spacing: -1.3px;
      line-height: 0.98;
      color: var(--black);
    }

    .unit {
      font-size: 13px;
      font-weight: 650;
      color: rgba(0,0,0,0.68);
    }

    .integrity-widget {
      display: grid;
      grid-template-columns: max-content 42px;
      column-gap: 0.35em;
      align-items: center;
      justify-items: start;
      text-align: left;
    }

    .integrity-copy {
      display: grid;
      grid-template-rows: auto auto;
      align-content: start;
      row-gap: 2px;
      justify-items: start;
      padding-top: 7px;
    }

    .integrity-main-number {
      display: flex;
      align-items: baseline;
      gap: 2px;
      color: var(--black);
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -0.9px;
      line-height: 0.95;
    }

    .integrity-circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 9px solid #e9a4a8;
      margin-top: 10px;
    }

    .schedule-panel {
      padding: 9px 11px 8px;
      border: 1px solid rgba(9,37,92,0.16);
      border-radius: 13px;
      background: #fff;
    }

    .schedule-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .schedule-title {
      font-size: 14px;
      font-weight: 850;
      text-shadow: 0.16px 0 currentColor;
    }

    .schedule-meta {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .slot-wrap {
      position: relative;
      padding-bottom: 17px;
    }

    .slot-grid {
      display: grid;
      grid-template-columns: repeat(24, minmax(8px, 1fr));
      gap: 2px;
      height: 35px;
      position: relative;
    }

    .hour-slot {
      border-radius: 3px;
      background: #f7f7f4;
      border: 1px solid rgba(0,0,0,0.05);
    }

    .hour-slot.off {
      background: var(--grid-navy);
    }

    .time-labels {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 10px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 750;
      line-height: 1;
    }

    .time-labels span {
      position: absolute;
      bottom: 0;
    }

    .solar-card {
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-rows: 112px minmax(0, 1fr) 34px;
      position: relative;
    }

    .solar-card-head {
      height: 112px;
      padding: 14px 52px 14px 18px;
      display: grid;
      grid-template-columns: minmax(160px, 0.72fr) 1px minmax(230px, 1fr);
      gap: 18px;
      align-items: center;
      background: var(--surface-2);
      border-bottom: 1px solid var(--line);
      overflow: hidden;
    }

    .solar-title {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
    }

    .solar-title h1 {
      margin: 0;
      font-size: clamp(23px, 2.05vw, 32px);
      font-weight: 900;
      line-height: 0.96;
      letter-spacing: -0.8px;
      text-shadow: 0.35px 0 currentColor;
    }

    .title-separator {
      width: 1px;
      height: 68px;
      background: var(--line-dark);
    }

    .power-summary-wrap {
      display: flex;
      align-items: center;
      height: 100%;
      padding: 0 12px;
    }

    .power-summary {
      display: grid;
      grid-template-rows: auto auto;
      align-content: center;
      gap: 7px;
      width: min(300px, 100%);
    }

    .power-total {
      padding-bottom: 6px;
      border-bottom: 1px solid var(--line);
    }

    .power-value {
      margin-top: 1px;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.6px;
      line-height: 1;
    }

    .sub-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      width: 100%;
    }

    .sub-metric .value {
      margin-top: 2px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
      white-space: nowrap;
    }

    .chart-box {
      margin: 10px 12px 0;
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: white;
      overflow: hidden;
      display: grid;
    }

    .solar-chart-card {
      min-height: 245px;
      margin: 8px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface-2);
      overflow: hidden;
      display: grid;
      grid-template-rows: 32px 1fr;
    }

    .solar-chart-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 8px;
      border-bottom: 1px solid #ecece7;
      background: white;
    }

    .solar-chart-title {
      font-size: 14px;
      font-weight: 800;
      text-shadow: 0.18px 0 currentColor;
    }

    .solar-chart-meta {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .chart-body {
      min-height: 0;
      padding: 8px 10px;
      position: relative;
      display: grid;
      background: #fff;
    }

    .mock-chart {
      width: 100%;
      height: 100%;
      min-height: 245px;
      border: 1px solid #eeeeea;
      border-radius: 8px;
      background:
        linear-gradient(to right, transparent 0, transparent calc(100% - 1px), rgba(0,0,0,0.04) calc(100% - 1px)),
        repeating-linear-gradient(to right, transparent 0 9%, rgba(0,0,0,0.045) 9.2% 9.35%),
        linear-gradient(180deg, rgba(255,221,85,0.38), rgba(255,221,85,0.08));
      position: relative;
      overflow: hidden;
    }

    .mock-chart::before {
      content: "";
      position: absolute;
      left: 6%;
      right: 5%;
      top: 44%;
      height: 3px;
      background: #050505;
      border-radius: 999px;
      transform: skewY(-7deg);
      box-shadow:
        70px -35px 0 #050505,
        145px -12px 0 #050505,
        230px -64px 0 #050505,
        315px -38px 0 #050505,
        430px -86px 0 #050505,
        540px -68px 0 #050505;
    }

    .solar-card-foot {
      height: 34px;
      padding: 6px 13px 9px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .history-link {
      border: 0;
      background: transparent;
      color: var(--black);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      padding: 0;
    }

    .system-card {
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background: var(--surface);
      position: relative;
    }

    .system-card-head {
      height: 72px;
      display: grid;
      grid-template-columns: max-content 1px minmax(0, 1fr);
      align-items: center;
      column-gap: 18px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-2);
    }

    .ems-card .system-card-head {
      height: 82px;
      grid-template-columns: max-content 1px minmax(340px, 1fr) 1px 118px;
      padding: 0 16px 0 22px;
      column-gap: 16px;
      background: linear-gradient(180deg, rgba(250,250,248,0.98), var(--surface-2) 132%);
    }

    .system-head-title {
      margin: 0;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.7px;
      line-height: 0.95;
      text-shadow: 0.25px 0 currentColor;
      color: var(--black);
      white-space: nowrap;
    }

    .ems-card .system-head-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 34px;
      letter-spacing: -0.9px;
    }

    .battery-card .system-head-title,
    .load-card .system-head-title {
      font-size: 22px;
    }

    .info-dot {
      width: 19px;
      height: 19px;
      display: inline-grid;
      place-items: center;
      border: 1px solid rgba(0,0,0,0.24);
      border-radius: 50%;
      background: rgba(255,255,255,0.72);
      color: rgba(0,0,0,0.66);
      font-size: 12px;
      font-weight: 900;
      line-height: 1;
      cursor: help;
      text-shadow: none;
    }

    .system-head-divider {
      width: 1px;
      height: 48px;
      background: rgba(0,0,0,0.14);
    }

    .ems-card .system-head-divider {
      height: 56px;
    }

    .system-card-body {
      min-height: 0;
      background: var(--surface);
    }

    .ems-body {
      min-height: 0;
      padding: 10px 14px 10px;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      gap: 8px;
      background:
        radial-gradient(circle at 22% 16%, rgba(255,213,0,0.065), transparent 30%),
        radial-gradient(circle at 83% 74%, rgba(0,91,187,0.04), transparent 34%),
        var(--surface);
    }

    .ems-head-control {
      min-width: 0;
      display: grid;
      grid-template-columns: 158px 20px 158px;
      column-gap: 9px;
      align-items: center;
      justify-content: center;
    }

    .ems-toggle,
    .mode-control {
      width: 158px;
      height: 42px;
      border: 1px solid rgba(0,0,0,0.14);
      border-radius: 18px;
      background: rgba(255,255,255,0.74);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 4px 10px rgba(0,0,0,0.04);
    }

    .ems-toggle {
      padding: 4px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      cursor: pointer;
    }

    .ems-toggle span {
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      color: rgba(0,0,0,0.56);
      font-size: 10.5px;
      font-weight: 900;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      user-select: none;
    }

    .ems-toggle .active {
      background: var(--black);
      color: #fff;
      box-shadow: 0 3px 8px rgba(0,0,0,0.16);
    }

    .between-mode-arrow {
      color: rgba(0,0,0,0.44);
      font-size: 22px;
      font-weight: 900;
      line-height: 1;
      text-align: center;
      transform: translateY(-1px);
    }

    .mode-control {
      position: relative;
      display: grid;
      place-items: center;
      padding: 5px 10px;
      cursor: pointer;
    }

    .mode-control.auto-locked {
      cursor: not-allowed;
      background:
        linear-gradient(135deg, rgba(0,0,0,0.025) 0 25%, transparent 25% 50%, rgba(0,0,0,0.025) 50% 75%, transparent 75%),
        rgba(255,255,255,0.70);
      background-size: 12px 12px;
    }

    .mode-control.auto-locked::after {
      content: "AUTO";
      position: absolute;
      right: 8px;
      bottom: 5px;
      color: rgba(0,0,0,0.42);
      font-size: 8px;
      font-weight: 900;
      letter-spacing: 0.04em;
      line-height: 1;
    }

    .mode-control.manual-selectable::after {
      content: "ЗМІНИТИ";
      position: absolute;
      right: 8px;
      bottom: 5px;
      color: rgba(0,91,187,0.66);
      font-size: 8px;
      font-weight: 900;
      letter-spacing: 0.03em;
      line-height: 1;
    }

    .mode-name {
      min-width: 0;
      color: var(--black);
      font-size: 13px;
      font-weight: 900;
      line-height: 0.98;
      letter-spacing: -0.1px;
      text-align: center;
      white-space: normal;
    }

    .mode-dropdown {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 6px);
      z-index: 30;
      padding: 5px;
      display: grid;
      gap: 4px;
      border: 1px solid rgba(0,0,0,0.14);
      border-radius: 14px;
      background: rgba(255,255,255,0.97);
      box-shadow: 0 12px 28px rgba(0,0,0,0.14);
    }

    .mode-option {
      padding: 7px 8px;
      border-radius: 10px;
      color: rgba(0,0,0,0.76);
      font-size: 11px;
      font-weight: 850;
      line-height: 1;
      white-space: nowrap;
    }

    .mode-option.active {
      background: rgba(0,91,187,0.08);
      color: var(--black);
    }

    .ems-risk-head {
      min-width: 0;
      height: 56px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      column-gap: 8px;
      align-items: center;
      cursor: help;
    }

    .risk-label-row {
      min-width: 0;
      display: grid;
      gap: 2px;
      color: rgba(0,0,0,0.70);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.015em;
      text-transform: uppercase;
      line-height: 0.98;
    }

    .risk-score {
      color: var(--black);
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -0.6px;
      line-height: 1;
      white-space: nowrap;
    }

    .risk-score small {
      color: rgba(0,0,0,0.56);
      font-size: 12px;
      font-weight: 800;
    }

    .ems-flow {
      min-height: 0;
      position: relative;
      display: grid;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 15px;
      background: rgba(255,255,255,0.74);

    function HistoryFooter() {
      const speedSteps = [
        "реальний час",
        "6 годин за 1хв",
        "12 годин за 1хв",
        "1 день за 1хв",
        "1 тиждень за 1хв",
        "1 місяць за 1хв",
        "6 місяців за 1хв",
        "1 рік за 1хв",
      ];

      const [date, setDate] = React.useState("2026-05-31");
      const [speedIndex, setSpeedIndex] = React.useState(0);

      const isRealtime = speedIndex === 0;
      const speedText = isRealtime
        ? ""
        : speedIndex < 0
          ? `<${speedSteps[Math.abs(speedIndex)]}`
          : `${speedSteps[Math.abs(speedIndex)]} >`;

      const stepSpeed = (delta) => {
        setSpeedIndex((current) => Math.max(-7, Math.min(7, current + delta)));
      };

      const resetToNow = () => {
        setDate("2026-06-01");
        setSpeedIndex(0);
      };

      const submitDate = (event) => {
        if (event.key === "Enter") {
          event.currentTarget.blur();
        }
      };

      return (
        <footer className="site-footer">
          <div className="footer-inner history-footer-final">
            <button
              className="history-skip-button backward"
              type="button"
              aria-label="Зменшити швидкість або рухатися назад"
              title="Кожне натискання зменшує швидкість на один крок. Після реального часу починається рух назад: 6 годин за 1хв → 12 годин за 1хв → день за 1хв → тиждень за 1хв → місяць за 1хв → 6 місяців за 1хв → рік за 1хв."
              onClick={() => stepSpeed(-1)}
            >
              <svg className="history-skip-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 5.5L12 12L4 18.5Z" />
                <path d="M11 5.5L19 12L11 18.5Z" />
                <rect x="19" y="5" width="2" height="14" rx="1" />
              </svg>
            </button>

            <div className="history-date-stack">
              <div className={`history-speed-state ${isRealtime ? "hidden" : ""}`}>
                {speedText}
              </div>
              <input
                className="history-date-field"
                type="date"
                value={date}
                aria-label="Поточна дата симуляції"
                title="Дата, яку система трактує як поточний момент симуляції. Enter — перейти до вибраного дня."
                onChange={(event) => setDate(event.target.value)}
                onKeyDown={submitDate}
              />
            </div>

            <button
              className="history-skip-button forward"
              type="button"
              aria-label="Збільшити швидкість або рухатися вперед"
              title="Кожне натискання збільшує швидкість на один крок: реальний час → 6 годин за 1хв → 12 годин за 1хв → день за 1хв → тиждень за 1хв → місяць за 1хв → 6 місяців за 1хв → рік за 1хв."
              onClick={() => stepSpeed(1)}
            >
              <svg className="history-skip-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 5.5L12 12L4 18.5Z" />
                <path d="M11 5.5L19 12L11 18.5Z" />
                <rect x="19" y="5" width="2" height="14" rx="1" />
              </svg>
            </button>

            <button
              className={`history-return-button ${isRealtime ? "hidden" : ""}`}
              type="button"
              onClick={resetToNow}
            >
              Повернутися до поточного моменту
            </button>
          </div>
        </footer>
      );
    }
